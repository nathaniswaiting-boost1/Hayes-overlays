
name: Build HAYES OVERLAYS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "SDK manager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract app project
        run: unzip -q HAYES-OVERLAYS-Android-Project.zip

      - name: Build APK
        run: gradle -p HAYES-OVERLAYS-Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAYES-OVERLAYS-APK
          path: HAYES-OVERLAYS-Android/app/build/outputs/apk/debug/app-debug.apk
